<head>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script type="text/babel">

// ═══════════════════════════════════════
// CHART.JS WRAPPERS — production-grade chart rendering
// ═══════════════════════════════════════
const ResponsiveContainer = ({ children, width, height }) => (
  <div style={{ width: width || "100%", height: height || 200, position: "relative" }}>{children}</div>
);

// Chart.js React hook — creates/destroys Chart instance
const useChartJS = (ref, config) => {
  const inst = React.useRef(null);
  React.useEffect(() => {
    if (!ref.current) return;
    if (inst.current) inst.current.destroy();
    inst.current = new Chart(ref.current, config);
    return () => { if (inst.current) { inst.current.destroy(); inst.current = null; } };
  });
};

// Bar Chart
const BarChart = ({ data, children }) => {
  const ref = React.useRef(null);
  const bars = React.Children.toArray(children).filter(c => c && c.type === Bar);
  const xAxis = React.Children.toArray(children).find(c => c && c.type === XAxis);
  const labelKey = xAxis && xAxis.props.dataKey ? xAxis.props.dataKey : Object.keys(data[0] || {})[0];
  useChartJS(ref, {
    type: 'bar',
    data: {
      labels: data.map(d => d[labelKey]),
      datasets: bars.map(b => {
        const cells = React.Children.toArray(b.props.children || []).filter(c => c && c.type === Cell);
        return {
          label: b.props.name || b.props.dataKey,
          data: data.map(d => d[b.props.dataKey] || 0),
          backgroundColor: cells.length ? data.map((_, i) => (cells[i] && cells[i].props.fill) || b.props.fill || '#3B82F6') : (b.props.fill || '#3B82F6'),
          borderRadius: 4,
          barPercentage: 0.7,
        };
      }),
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 600 },
      plugins: { legend: { display: bars.length > 1, labels: { font: { size: 10 } } }, tooltip: { titleFont: { size: 11 }, bodyFont: { size: 11 } } },
      scales: {
        x: { ticks: { font: { size: 9 }, maxRotation: 0 }, grid: { display: false } },
        y: { beginAtZero: true, ticks: { font: { size: 9 } }, grid: { color: '#F1F5F9' } },
      },
    },
  });
  return <canvas ref={ref} />;
};

const Bar = function(props) { return null; };
const Cell = function(props) { return null; };

// Line Chart
const LineChart = ({ data, children }) => {
  const ref = React.useRef(null);
  const lines = React.Children.toArray(children).filter(c => c && c.type === Line);
  const xAxis = React.Children.toArray(children).find(c => c && c.type === XAxis);
  const labelKey = xAxis && xAxis.props.dataKey ? xAxis.props.dataKey : Object.keys(data[0] || {})[0];
  useChartJS(ref, {
    type: 'line',
    data: {
      labels: data.map(d => d[labelKey]),
      datasets: lines.map(l => ({
        label: l.props.name || l.props.dataKey,
        data: data.map(d => d[l.props.dataKey]),
        borderColor: l.props.stroke || '#3B82F6',
        backgroundColor: 'transparent',
        borderWidth: l.props.strokeWidth || 2,
        borderDash: l.props.strokeDasharray ? [5, 5] : [],
        pointRadius: 3,
        pointBackgroundColor: l.props.stroke || '#3B82F6',
        tension: 0.3,
        fill: false,
      })),
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 600 },
      plugins: { legend: { labels: { font: { size: 10 } } }, tooltip: { titleFont: { size: 11 }, bodyFont: { size: 11 } } },
      scales: {
        x: { ticks: { font: { size: 9 }, maxRotation: 0 }, grid: { display: false } },
        y: { ticks: { font: { size: 9 } }, grid: { color: '#F1F5F9' } },
      },
    },
  });
  return <canvas ref={ref} />;
};

const Line = function(props) { return null; };

// Area Chart
const AreaChart = ({ data, children }) => {
  const ref = React.useRef(null);
  const areas = React.Children.toArray(children).filter(c => c && c.type === Area);
  const xAxis = React.Children.toArray(children).find(c => c && c.type === XAxis);
  const labelKey = xAxis && xAxis.props.dataKey ? xAxis.props.dataKey : Object.keys(data[0] || {})[0];
  useChartJS(ref, {
    type: 'line',
    data: {
      labels: data.map(d => d[labelKey]),
      datasets: areas.map(a => ({
        label: a.props.name || a.props.dataKey,
        data: data.map(d => d[a.props.dataKey]),
        borderColor: a.props.stroke || '#3B82F6',
        backgroundColor: a.props.fill || ((a.props.stroke || '#3B82F6') + '25'),
        borderWidth: a.props.strokeWidth || 2,
        pointRadius: 0,
        tension: 0.3,
        fill: true,
      })),
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 600 },
      plugins: { legend: { labels: { font: { size: 10 } } }, tooltip: { titleFont: { size: 11 }, bodyFont: { size: 11 } } },
      scales: {
        x: { ticks: { font: { size: 9 }, maxRotation: 0 }, grid: { display: false } },
        y: { ticks: { font: { size: 9 } }, grid: { color: '#F1F5F9' } },
      },
    },
  });
  return <canvas ref={ref} />;
};

const Area = function(props) { return null; };

// Composed Chart (bars + lines with dual y-axis)
const ComposedChart = ({ data, children }) => {
  const ref = React.useRef(null);
  const bars = React.Children.toArray(children).filter(c => c && c.type === Bar);
  const lines = React.Children.toArray(children).filter(c => c && c.type === Line);
  const xAxis = React.Children.toArray(children).find(c => c && c.type === XAxis);
  const labelKey = xAxis && xAxis.props.dataKey ? xAxis.props.dataKey : Object.keys(data[0] || {})[0];
  const hasLines = lines.length > 0;
  const scales = {
    x: { ticks: { font: { size: 9 }, maxRotation: 0 }, grid: { display: false } },
    y: { position: 'left', beginAtZero: true, ticks: { font: { size: 9 } }, grid: { color: '#F1F5F9' } },
  };
  if (hasLines) {
    scales.y1 = { position: 'right', ticks: { font: { size: 9 } }, grid: { drawOnChartArea: false } };
  }
  useChartJS(ref, {
    type: 'bar',
    data: {
      labels: data.map(d => d[labelKey]),
      datasets: [
        ...bars.map(b => {
          const cells = React.Children.toArray(b.props.children || []).filter(c => c && c.type === Cell);
          return {
            type: 'bar',
            label: b.props.name || b.props.dataKey,
            data: data.map(d => d[b.props.dataKey] || 0),
            backgroundColor: cells.length ? data.map((_, i) => (cells[i] && cells[i].props.fill) || b.props.fill || '#3B82F6') : (b.props.fill || '#3B82F6'),
            borderRadius: 4,
            barPercentage: 0.7,
            yAxisID: 'y',
            order: 2,
          };
        }),
        ...lines.map(l => ({
          type: 'line',
          label: l.props.name || l.props.dataKey,
          data: data.map(d => d[l.props.dataKey]),
          borderColor: l.props.stroke || '#EF4444',
          backgroundColor: 'transparent',
          borderWidth: l.props.strokeWidth || 2,
          pointRadius: 3,
          pointBackgroundColor: l.props.stroke || '#EF4444',
          tension: 0.3,
          fill: false,
          yAxisID: hasLines ? 'y1' : 'y',
          order: 1,
        })),
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 600 },
      plugins: { legend: { labels: { font: { size: 10 } } }, tooltip: { titleFont: { size: 11 }, bodyFont: { size: 11 } } },
      scales: scales,
    },
  });
  return <canvas ref={ref} />;
};

const PieChart = ({ children }) => {
  const pie = React.Children.toArray(children).find(c => c && c.type === Pie);
  if (!pie) return null;
  const data = pie.props.data || [];
  const total = data.reduce((s, d) => s + (d[pie.props.dataKey] || 0), 0);
  const cells = React.Children.toArray(pie.props.children || []).filter(c => c && c.type === Cell);
  let cum = 0;
  return (
    <div style={{ height: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 16 }}>
      <svg viewBox="-1.2 -1.2 2.4 2.4" style={{ width: 120, height: 120 }}>
        {data.map((d, i) => {
          const val = d[pie.props.dataKey] || 0;
          const pct = val / total;
          const start = cum * Math.PI * 2 - Math.PI/2;
          cum += pct;
          const end = cum * Math.PI * 2 - Math.PI/2;
          const large = pct > 0.5 ? 1 : 0;
          const x1 = Math.cos(start), y1 = Math.sin(start);
          const x2 = Math.cos(end), y2 = Math.sin(end);
          const inner = pie.props.innerRadius ? 0.5 : 0;
          const color = cells[i] ? cells[i].props.fill : (d.color || ["#0F2137","#C87941","#14B8A6","#3B82F6","#22C55E"][i % 5]);
          if (inner > 0) {
            const ix1 = x1*inner, iy1 = y1*inner, ix2 = x2*inner, iy2 = y2*inner;
            return <path key={i} d={"M"+x1+","+y1+" A1,1 0 "+large+",1 "+x2+","+y2+" L"+ix2+","+iy2+" A"+inner+","+inner+" 0 "+large+",0 "+ix1+","+iy1+"Z"} fill={color} />;
          }
          return <path key={i} d={"M0,0 L"+x1+","+y1+" A1,1 0 "+large+",1 "+x2+","+y2+"Z"} fill={color} />;
        })}
      </svg>
      <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
        {data.map((d, i) => {
          const color = cells[i] ? cells[i].props.fill : (d.color || ["#0F2137","#C87941","#14B8A6","#3B82F6","#22C55E"][i % 5]);
          return <div key={i} style={{ fontSize: 9, display: "flex", alignItems: "center", gap: 4 }}>
            <div style={{ width: 8, height: 8, borderRadius: 2, background: color, flexShrink: 0 }} />
            <span style={{ color: "#475569" }}>{d.name || d[Object.keys(d)[0]]} {((d[pie.props.dataKey]/total)*100).toFixed(0)}%</span>
          </div>;
        })}
      </div>
    </div>
  );
};

const Pie = ({ data, dataKey, cx, cy, innerRadius, outerRadius, label, labelLine, children }) => null;

// Radar Chart
const RadarChart = ({ data, children }) => {
  const radars = React.Children.toArray(children).filter(c => c && c.type === Radar);
  if (!data || !data.length) return <div />;
  const n = data.length;
  const cx = 50, cy = 50, r = 38;
  const angleStep = (Math.PI * 2) / n;
  const getPoint = (i, val) => {
    const a = i * angleStep - Math.PI / 2;
    const d = (val / 100) * r;
    return { x: cx + d * Math.cos(a), y: cy + d * Math.sin(a) };
  };
  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", alignItems: "center" }}>
      <svg viewBox="0 0 100 100" style={{ flex: 1, maxHeight: "85%" }}>
        {[20,40,60,80,100].map(v => (
          <polygon key={v} points={data.map((_,i) => { const p = getPoint(i, v); return p.x+","+p.y; }).join(" ")} fill="none" stroke="#E2E8F0" strokeWidth={0.3} />
        ))}
        {data.map((_, i) => {
          const p = getPoint(i, 100);
          return <line key={i} x1={cx} y1={cy} x2={p.x} y2={p.y} stroke="#E2E8F0" strokeWidth={0.3} />;
        })}
        {radars.map((radar, ri) => {
          const col = (radar.props.stroke || "EF4444").replace("#","");
          const pts = data.map((d, i) => getPoint(i, d[radar.props.dataKey] || 0));
          return <polygon key={ri} points={pts.map(p=>p.x+","+p.y).join(" ")} fill={"#"+col} fillOpacity={radar.props.fillOpacity || 0.15} stroke={"#"+col} strokeWidth={1} />;
        })}
        {data.map((d, i) => {
          const p = getPoint(i, 112);
          const dimKey = Object.keys(d).find(k => typeof d[k] === "string") || Object.keys(d)[0];
          return <text key={i} x={p.x} y={p.y} textAnchor="middle" dominantBaseline="middle" style={{ fontSize: 3.5, fill: "#475569" }}>{d[dimKey]}</text>;
        })}
      </svg>
      <div style={{display:"flex",gap:12,justifyContent:"center"}}>
        {radars.map((r,i) => <span key={i} style={{fontSize:10,color:"#"+(r.props.stroke||"333").replace("#","")}}>● {r.props.name||r.props.dataKey}</span>)}
      </div>
    </div>
  );
};

const Radar = ({ name, dataKey, stroke, fill, fillOpacity, strokeWidth }) => null;
const PolarGrid = () => null;
const PolarAngleAxis = () => null;
const PolarRadiusAxis = () => null;

// Scatter Chart with proper X/Y axis labels and ticks
const ScatterChart = ({ children, margin }) => {
  const scatters = React.Children.toArray(children).filter(c => c && c.type === Scatter);
  const allData = scatters.flatMap(s => (s.props.data || []).map(d => ({...d, _color: s.props.fill})));
  if (!allData.length) return <div style={{height:"100%"}} />;
  const xMin = Math.min(...allData.map(d=>d.x)); const xMax = Math.max(...allData.map(d=>d.x));
  const yMin = Math.min(...allData.map(d=>d.y)); const yMax = Math.max(...allData.map(d=>d.y));
  // Add padding to ranges
  const xPad = (xMax - xMin) * 0.1 || 10; const yPad = (yMax - yMin) * 0.1 || 10;
  const xLo = xMin - xPad; const xHi = xMax + xPad;
  const yLo = Math.max(0, yMin - yPad); const yHi = yMax + yPad;
  const xRange = xHi - xLo || 1; const yRange = yHi - yLo || 1;
  // Generate nice tick values
  const xTickCount = 7; const yTickCount = 5;
  const xTicks = Array.from({length: xTickCount}, (_, i) => Math.round(xLo + (xRange * i / (xTickCount - 1))));
  const yTicks = Array.from({length: yTickCount}, (_, i) => Math.round(yLo + (yRange * i / (yTickCount - 1))));
  // Find XAxis/YAxis children for labels
  const xAxisChild = React.Children.toArray(children).find(c => c && c.type === XAxis);
  const yAxisChild = React.Children.toArray(children).find(c => c && c.type === YAxis);
  const xLabel = xAxisChild?.props?.label?.value || xAxisChild?.props?.name || "";
  const yLabel = yAxisChild?.props?.label?.value || yAxisChild?.props?.name || "";
  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column" }}>
      <div style={{ flex: 1, display: "flex" }}>
        {/* Y-axis label (rotated) */}
        <div style={{ width: 16, display: "flex", alignItems: "center", justifyContent: "center" }}>
          {yLabel && <span style={{ fontSize: 9, color: "#94A3B8", writingMode: "vertical-rl", transform: "rotate(180deg)", whiteSpace: "nowrap" }}>{yLabel}</span>}
        </div>
        {/* Y-axis ticks */}
        <div style={{ width: 32, display: "flex", flexDirection: "column-reverse", justifyContent: "space-between", paddingBottom: 2, paddingRight: 4 }}>
          {yTicks.map((v, i) => <span key={i} style={{ fontSize: 8, color: "#94A3B8", textAlign: "right", lineHeight: 1 }}>{v}</span>)}
        </div>
        {/* Plot area */}
        <div style={{ flex: 1, position: "relative", borderLeft: "1px solid #E2E8F0", borderBottom: "1px solid #E2E8F0" }}>
          {/* Grid lines */}
          {[0.25, 0.5, 0.75].map(f => <div key={"h"+f} style={{ position: "absolute", left: 0, right: 0, bottom: (f * 100) + "%", borderTop: "1px dashed #F1F5F9" }} />)}
          {[0.25, 0.5, 0.75].map(f => <div key={"v"+f} style={{ position: "absolute", top: 0, bottom: 0, left: (f * 100) + "%", borderLeft: "1px dashed #F1F5F9" }} />)}
          {/* Zero line if range crosses zero */}
          {xLo < 0 && xHi > 0 && <div style={{ position: "absolute", top: 0, bottom: 0, left: ((0 - xLo) / xRange * 100) + "%", borderLeft: "1px solid #CBD5E1" }} />}
          {/* Data points */}
          {allData.map((d, i) => {
            const left = ((d.x - xLo) / xRange) * 100;
            const bottom = ((d.y - yLo) / yRange) * 100;
            const size = Math.max(10, Math.min(24, (d.z || 50) / 4));
            return <div key={i} title={d.name + ": " + d.y + " k\u20AC, " + (d.x>0?"+":"") + d.x + "% growth, ~" + d.z + "% margin"} style={{
              position: "absolute", left: left+"%", bottom: bottom+"%",
              width: size, height: size, borderRadius: "50%",
              background: d._color || "#3B82F6", opacity: 0.75,
              transform: "translate(-50%, 50%)", cursor: "pointer",
              boxShadow: "0 1px 3px rgba(0,0,0,0.15)",
            }} />;
          })}
        </div>
      </div>
      {/* X-axis ticks */}
      <div style={{ display: "flex", justifyContent: "space-between", marginLeft: 48, padding: "4px 0" }}>
        {xTicks.map((v, i) => <span key={i} style={{ fontSize: 8, color: "#94A3B8" }}>{v}</span>)}
      </div>
      {/* X-axis label */}
      {xLabel && <div style={{ textAlign: "center", marginLeft: 48, fontSize: 9, color: "#94A3B8", marginTop: -2 }}>{xLabel}</div>}
      {/* Legend */}
      <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap",fontSize:9,marginTop:4}}>
        {scatters.map((s,i) => <span key={i} style={{color:s.props.fill}}>● {s.props.name}</span>)}
      </div>
    </div>
  );
};

const Scatter = ({ data, fill, name }) => null;
const ZAxis = () => null;

// Unused stubs
const XAxis = () => null;
const YAxis = () => null;
const CartesianGrid = () => null;
const Tooltip = () => null;
const Legend = () => null;


const langToggleStyle = {position:"fixed",top:14,right:18,zIndex:9999,display:"flex",gap:2,background:"rgba(15,33,55,0.92)",borderRadius:8,padding:3,border:"1px solid rgba(255,255,255,0.08)",backdropFilter:"blur(12px)",boxShadow:"0 2px 12px rgba(0,0,0,0.3)"};
const langBtnBase = {padding:"6px 16px",border:"none",borderRadius:6,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit",letterSpacing:0.5};

function LangToggle({ lang, setLang }) {
  return (
    <div style={langToggleStyle}>
      <button style={{...langBtnBase, background: lang==='de'?"#C87941":"transparent", color: lang==='de'?"#fff":"rgba(255,255,255,0.4)"}} onClick={()=>setLang('de')}>DE</button>
      <button style={{...langBtnBase, background: lang==='en'?"#C87941":"transparent", color: lang==='en'?"#fff":"rgba(255,255,255,0.4)"}} onClick={()=>setLang('en')}>EN</button>
    </div>
  );
}

function PasswordGate({ onUnlock, lang, setLang }) {
  const [pw, setPw] = React.useState('');
  const [err, setErr] = React.useState(false);
  const en = lang === 'en';
  const check = () => { if (pw === 'TEA2026') onUnlock(); else { setErr(true); setTimeout(() => setErr(false), 2000); } };
  return (
    <div>
      <LangToggle lang={lang} setLang={setLang} />
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(155deg,#080F1A 0%,#0F2137 40%,#1B3A5C 75%,#1A4C7A 100%)",position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",inset:0,opacity:0.03,backgroundImage:"radial-gradient(circle at 1px 1px,rgba(255,255,255,0.4) 1px,transparent 0)",backgroundSize:"40px 40px"}} />
        <div style={{background:"rgba(255,255,255,0.03)",backdropFilter:"blur(20px)",border:"1px solid rgba(255,255,255,0.06)",borderRadius:24,padding:"52px 44px",textAlign:"center",position:"relative",zIndex:1,maxWidth:440,width:"90%",animation:"fadeUp 0.8s ease-out"}}>
          <div style={{fontSize:10,color:"#C87941",letterSpacing:5,textTransform:"uppercase",fontWeight:600,marginBottom:24}}>{en ? 'Confidential Document' : 'Vertrauliches Dokument'}</div>
          <h1 style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:48,fontWeight:900,color:"#fff",marginBottom:4,lineHeight:1.1}}>TEA <span style={{color:"#C87941"}}>2026</span></h1>
          <div style={{width:50,height:3,background:"linear-gradient(90deg,#C87941,#D4A853)",margin:"16px auto 20px",borderRadius:2}} />
          <p style={{fontSize:13,color:"rgba(255,255,255,0.35)",marginBottom:36,fontStyle:"italic"}}>{en ? 'Strategic Action Plan — Password Protected' : 'Strategieplan — Passwortgeschützt'}</p>
          <div style={{fontSize:10,color:"rgba(255,255,255,0.3)",letterSpacing:1,textTransform:"uppercase",marginBottom:8,fontWeight:600}}>{en ? 'Password' : 'Passwort'}</div>
          <input style={{width:"100%",padding:"14px 18px",borderRadius:12,border:"1px solid rgba(255,255,255,0.1)",background:"rgba(255,255,255,0.04)",color:"#fff",fontSize:15,fontFamily:"inherit",outline:"none",textAlign:"center",letterSpacing:3}} type="password" placeholder={en?"Enter password...":"Passwort eingeben..."} value={pw} onChange={(e)=>setPw(e.target.value)} onKeyDown={(e)=>e.key==='Enter'&&check()} autoFocus />

// PAGE: RISK MANAGEMENT (NEW!)
// ═══════════════════════════════════════════
function RiskPage({ lang }) {
  const t = (de, en) => lang === "en" ? en : de;
  const riskColors = (score) => score >= 12 ? C.red : score >= 6 ? C.amber : C.green;

  return (
    <div>
      <SectionHead
        tag={t("Risiken","RISKS")}
        title={t("Risiken — kompakt","Risks — Compact")}
        sub={t("Die wichtigsten Risiken und wie wir gegensteuern","The key risks and how we counter them")}
      />

      <Grid cols="3fr 2fr" gap={20} style={{ marginBottom: 20 }}>
        {/* Risk matrix visual */}
        <Card>
          <h3 style={{ fontSize: 15, fontWeight: 700, color: C.navy, margin: "0 0 14px 0" }}>{t("Risikomatrix (Wahrscheinlichkeit × Auswirkung)","Risk Matrix (Probability × Impact)")}</h3>
          <div style={{ display: "grid", gridTemplateColumns: "40px repeat(4, 1fr)", gridTemplateRows: "repeat(4, 56px) 26px", gap: 2 }}>
            {[4, 3, 2, 1].map((y) => (
              <div key={`y-${y}`} style={{ display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, color: C.textLight, fontWeight: 600 }}>
                {y === 4 ? t("Hoch","High") : y === 3 ? t("Mittel","Medium") : y === 2 ? t("Niedrig","Low") : t("Gering","Minor")}
              </div>
            ))}
            {[4, 3, 2, 1].map(y =>
              [1, 2, 3, 4].map(x => {
                const cellRisks = risks.filter(r => r.prob === x && r.impact === y);
                const severity = x * y;
                return (
                  <div key={`${x}-${y}`} style={{
                    background: severity >= 12 ? `${C.red}15` : severity >= 6 ? `${C.amber}12` : `${C.green}08`,
                    borderRadius: 6, padding: 4, display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "center", gap: 2,
                    border: `1px solid ${severity >= 12 ? `${C.red}25` : severity >= 6 ? `${C.amber}20` : `${C.green}15`}`,
                  }}>
                    {cellRisks.map((r, i) => (
                      <div key={i} style={{
                        fontSize: 8, fontWeight: 600, color: riskColors(x * y), textAlign: "center", lineHeight: 1.2,
                        background: "#FFF", borderRadius: 3, padding: "2px 4px", maxWidth: "100%",
                      }}>
                        {(lang === "en" ? r.nameEn : r.name).substring(0, 22)}{(lang === "en" ? r.nameEn : r.name).length > 22 ? "…" : ""}
                      </div>
                    ))}
                  </div>
                );
              })
            )}
            <div />
            {[t("Gering","Minor"), t("Niedrig","Low"), t("Mittel","Medium"), t("Hoch","High")].map((l, i) => (
              <div key={`x-${i}`} style={{ display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, color: C.textLight, fontWeight: 600 }}>{l}</div>
            ))}
          </div>
          <div style={{ display: "flex", gap: 4, marginTop: 8, fontSize: 10, color: C.textLight }}>
            <span>{t("← Eintrittswahrscheinlichkeit →","← Probability →")}</span>
            <span style={{ marginLeft: "auto" }}>{t("↑ Auswirkung","↑ Impact")}</span>
          </div>
        </Card>

        {/* Strengths / protective factors (short) */}
        <Card accent={C.green}>
          <h3 style={{ fontSize: 15, fontWeight: 700, color: C.green, margin: "0 0 12px 0" }}>{t("Unsere Schutzfaktoren","Our Protective Factors")}</h3>
          {[
            { t: t("Solide finanziert","Solidly Financed"), d: t("Wir finanzieren Wachstum aus eigener Kraft — kaum abhängig von Banken.","We finance growth from our own strength — barely dependent on banks.") },
            { t: t("Breites Portfolio","Broad portfolio"), d: t("11+ Warengruppen, keine gefährliche Abhängigkeit von einem Produkt.","11+ product groups, no dangerous dependency on a single product.") },
            { t: t("Technische Expertise 60+ J.","Technical expertise 60+ yrs"), d: t("Beratung, Custom, Service — schwer kopierbar.","Consulting, custom, service — hard to copy.") },
            { t: t("Inhabergeführt","Owner-managed"), d: t("Schnelle Entscheidungen, langfristige Orientierung.","Fast decisions, long-term orientation.") },
          ].map((s, i) => (
            <div key={i} style={{ marginBottom: 9, paddingLeft: 12, borderLeft: `2px solid ${C.green}30` }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: C.text }}>{s.t}</div>
              <div style={{ fontSize: 10.5, color: C.textLight, lineHeight: 1.5 }}>{s.d}</div>
            </div>
          ))}
        </Card>
      </Grid>

      {/* Compact risk table */}
      <Card>
        <h3 style={{ fontSize: 15, fontWeight: 700, color: C.navy, margin: "0 0 14px 0" }}>{t("Risiken & Gegenmaßnahmen","Risks & Countermeasures")}</h3>
        <CompactTable
          headers={[t("Risiko","Risk"), t("Kategorie","Category"), "Score", t("Gegenmaßnahme","Countermeasure")]}
          rows={risks
            .slice()
            .sort((a, b) => (b.prob * b.impact) - (a.prob * a.impact))
            .map(r => [
              <span style={{ fontWeight: 600 }}>{lang === "en" ? r.nameEn : r.name}</span>,
              <Tag color={C.navy}>{lang === "en" ? r.catEn : r.cat}</Tag>,
              <Tag color={riskColors(r.prob * r.impact)} filled>{r.prob * r.impact}</Tag>,
              <span style={{ fontSize: 10.5, color: C.textLight }}>{lang === "en" ? r.mitigationEn : r.mitigation}</span>,
            ])}
        />
      </Card>
    </div>
  );
}

function TEADashboard({ lang }) {
  const t = (de, en) => lang === "en" ? en : de;
  const [page, setPage] = useState("cover");

  useEffect(() => {
    if (contentRef.current) {
      contentRef.current.scrollTo({ top: 0, behavior: "smooth" });
    }
  }, [page]);

  const renderPage = () => {
    switch (page) {
      case "cover": return <CoverPage lang={lang} onStart={() => setPage("summary")} />;
      case "summary": return <SummaryPage lang={lang} />;
      case "finance": return <FinancePage lang={lang} />;
      case "market": return <MarketPage lang={lang} />;
      case "products": return <ProductsPage lang={lang} />;
      case "strategy": return <StrategyPage lang={lang} />;
      case "digital": return <DigitalPage lang={lang} />;
      case "risk": return <RiskPage lang={lang} />;
      case "roadmap": return <RoadmapPage lang={lang} />;
      case "kpi": return <KPIPage lang={lang} />;
      default: return <SummaryPage lang={lang} />;
    }
  };

  if (page === "cover") {
    return (
      <div style={{ fontFamily: "'DM Sans', 'Segoe UI', sans-serif" }}>
        <CoverPage lang={lang} onStart={() => setPage("summary")} />
      </div>
    );
  }

  // Group pages for sidebar
  let lastGroup = "";

  return (
    <div style={{ display: "flex", height: "100vh", fontFamily: "'DM Sans', 'Segoe UI', sans-serif", background: C.bg }}>
      {/* Sidebar */}
      <nav style={{
        width: 210, background: C.navy, color: "#FFF", display: "flex", flexDirection: "column", flexShrink: 0,
        borderRight: `1px solid ${C.navyLight}`,

        </div>

        {/* Navigation */}
        <div style={{ flex: 1, overflowY: "auto", padding: "8px 0" }}>
          {PAGES.filter(p => p.id !== "cover").map((p) => {
            const showGroup = p.group !== lastGroup && p.group !== "start";
            lastGroup = p.group;
            return (
              <div key={p.id}>
                {showGroup && (
                  <div style={{ padding: "12px 18px 4px", fontSize: 9, color: "rgba(255,255,255,0.25)", letterSpacing: 1.5, fontWeight: 700, textTransform: "uppercase" }}>

                  color: page === p.id ? C.copper : "rgba(255,255,255,0.55)",

  );
}


function RootApp() {
  const [unlocked, setUnlocked] = React.useState(false);
  const [lang, setLang] = React.useState('de');
  if (!unlocked) return <PasswordGate onUnlock={() => setUnlocked(true)} lang={lang} setLang={setLang} />;
  return (
    <div>
      <LangToggle lang={lang} setLang={setLang} />
      <TEADashboard lang={lang} />
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<RootApp />);

</script>
</body>
</html>
